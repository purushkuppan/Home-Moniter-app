# Production profile for the hub. Activate with --spring.profiles.active=prod (set in the systemd unit).
# Settings here override application.properties.
#
# No secrets in this file. homeassistant.token comes from the systemd credential directory through the
# configtree import in application.properties, e.g. in the unit:
#   LoadCredential=homeassistant.token:/etc/homehub/credentials/homeassistant.token

spring.datasource.url=jdbc:sqlite:/opt/homehub/data/homehub.db

# Home Assistant runs on the same machine as the hub.
homeassistant.url=http://127.0.0.1:8123

homehub.connectors.fake.enabled=false
homehub.connectors.homeassistant.enabled=true
homehub.connectors.homeassistant.include=binary_sensor.*_door,sensor.*_temperature,sensor.*_machine_state,sensor.*_job_state,sensor.*_battery,lock.*,\
  binary_sensor.living_room_backdoor_openclose,binary_sensor.kitchen_water_leak_xs_sensor_water_leak_detected,\
  switch.indoor_smart_plug,sensor.indoor_smart_plug_electric_consumption_w,\
  sensor.living_room_backdoor_openclose_battery_level,sensor.kitchen_water_leak_xs_sensor_battery_level

management.endpoint.health.show-details=never

# Alerts go to these phones (Home Assistant Companion app); tapping one opens the dashboard: through Tailscale
# (ADR 10), so it works at home and away while the phone's Tailscale app is on.
homehub.alerts.send-to=notify.mobile_app_purushphone
# Critical alerts (a water leak) are also spoken at full alarm volume on this Android phone (#150).
homehub.alerts.critical.speak-on=notify.mobile_app_purushphone
homehub.alerts.link=http://kudil:8080

# Alert when the nightly backup (deploy/backup.sh, installed by setup-hub.sh) stops succeeding.
homehub.alerts.backup.status-file=/var/lib/homehub-backup/last-success

# Power cuts and internet outages at home (#103): the laptop's charger and battery, two public DNS resolvers and the
# Tailscale coordination server.
homehub.hub.power-supply-dir=/sys/class/power_supply
homehub.hub.internet-hosts=1.1.1.1:53,8.8.8.8:53,controlplane.tailscale.com:443

# Android alerts through ntfy on the hub (#154, deploy/setup-ntfy.sh). The topic and token are systemd credentials
# (homehub.ntfy.topic, homehub.ntfy.token); while the topic is empty, ntfy stays off.
homehub.ntfy.url=http://127.0.0.1:2586

# The Z-Wave JS server inside the zwave-js-ui container, published on the hub itself only (setup-zwave.sh).
homehub.zwave.url=ws://127.0.0.1:3000

# Written by deploy/install-release.sh when a new release failed its checks and was rolled back (#124).
homehub.deploy.status-file=/opt/homehub/data/deploy-rolled-back

# Reload SmartThings when the fridge, which reports its power about every 16 minutes, is silent for 45 minutes.
homehub.watchdog.entity=sensor.kitchen_refrigerator_power

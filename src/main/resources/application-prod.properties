# Production profile for the hub. Activate with --spring.profiles.active=prod (set in the systemd unit).
# Settings here override application.properties.
#
# No secrets in this file. homeassistant.token comes from the systemd credential directory through the
# configtree import in application.properties, e.g. in the unit:
#   LoadCredential=homeassistant.token:/etc/homehub/credentials/homeassistant.token

spring.datasource.url=jdbc:sqlite:/opt/homehub/data/homehub.db

# Home Assistant runs on the same machine as the hub.
homeassistant.url=http://127.0.0.1:8123

homehub.connectors.fake.enabled=false
homehub.connectors.homeassistant.enabled=true
homehub.connectors.homeassistant.include=binary_sensor.*_door,sensor.*_temperature,sensor.*_machine_state,sensor.*_job_state,lock.*

management.endpoint.health.show-details=never

# Alerts go to these phones (Home Assistant Companion app); tapping one opens the dashboard.
homehub.alerts.send-to=notify.mobile_app_purushphone
homehub.alerts.link=http://192.168.5.251:8080

# Production profile for the home hub: --spring.profiles.active=prod
spring.datasource.url=jdbc:sqlite:/opt/homehub/data/homehub.db
homehub.connectors.fake.enabled=false
# SmartThings reads SMARTTHINGS_TOKEN from /etc/homehub/homehub.env (loaded by systemd).
homehub.connectors.smartthings.enabled=true
management.endpoint.health.show-details=never

spring.application.name=homehub
spring.datasource.url=jdbc:sqlite:data/homehub.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
# SQLite write-ahead logging: dashboard reads and event writes don't block each other. Set on every connection
# (the driver turns these properties into PRAGMAs), so they also apply when a test or the hub changes the URL.
# With WAL on, back up with "sqlite3 homehub.db '.backup ...'" or VACUUM INTO, never a plain file copy.
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.synchronous=NORMAL
# Schema migrations: src/main/resources/db/migration. A database made before Flyway (events table, no
# flyway_schema_history) is marked as version 1 without running V1 again.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
management.endpoints.web.exposure.include=health,info
# Browsers must check for a newer dashboard on every visit (a quick "not modified" answer when nothing changed),
# otherwise phones keep showing an old copy after a deploy.
spring.web.resources.cache.cachecontrol.no-cache=true
# Files inside the jar are all dated 1980, so "has it changed since...?" would always be answered "no" and browsers
# would keep an old copy forever. Without a Last-Modified date they simply download the (small) page again.
spring.web.resources.cache.use-last-modified=false

# API docs (ADR 11): OpenAPI spec at /v3/api-docs, Swagger UI at /swagger-ui.html, for /api/** only (not actuator or
# the dashboard). On while Kudil is home-network/Tailscale-only; set both to false to switch them off (404).
# The spec is built on its first request, not at startup.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.paths-to-match=/api/**

# Secrets live outside the project and are never committed. See README.md and secrets.properties.example.
#  - ~/.homehub/secrets.properties     (local machine)
#  - $CREDENTIALS_DIRECTORY/<property>  (systemd LoadCredential=, one file per property)
# Environment variables (HOMEASSISTANT_URL, HOMEASSISTANT_TOKEN) still work as a fallback.
spring.config.import=optional:file:${user.home}/.homehub/secrets.properties,optional:configtree:${CREDENTIALS_DIRECTORY:/nonexistent}/

# Device connectors
homehub.connectors.enabled=true
homehub.connectors.interval=30s
homehub.connectors.fake.enabled=true
# Home Assistant (disabled by default). Needs homeassistant.url and homeassistant.token (see above).
homehub.connectors.homeassistant.enabled=false
# Live updates: Home Assistant pushes every change instantly (WebSocket). Polling still runs as a safety net.
homehub.connectors.homeassistant.live=true
# While live updates work, Home Assistant's full state list is only read this often (a safety net); while they
# don't, on every connectors interval.
homehub.connectors.homeassistant.poll-while-live=5m
# "Unavailable" or "unknown" readings are only stored after this long. A SmartThings reload makes every Samsung
# entity unavailable for a few seconds; readings that come back sooner leave no trace. 0s stores them at once.
homehub.connectors.homeassistant.unavailable-grace=2m
# Entity ids to read, comma-separated, * matches anything. The Z-Wave devices (#36) are listed by their exact ids:
# Home Assistant names them inconsistently, so a pattern would miss some.
homehub.connectors.homeassistant.include=binary_sensor.*_door,sensor.*_temperature,sensor.*_machine_state,sensor.*_job_state,sensor.*_battery,lock.*,\
  binary_sensor.living_room_backdoor_openclose,binary_sensor.kitchen_water_leak_xs_sensor_water_leak_detected,\
  switch.indoor_smart_plug,sensor.indoor_smart_plug_electric_consumption_w,\
  sensor.living_room_backdoor_openclose_battery_level,sensor.kitchen_water_leak_xs_sensor_battery_level
# Dashboard names for entities whose Home Assistant device name reads badly. Keep the [brackets] for the dots.
homehub.connectors.homeassistant.names.[binary_sensor.living_room_backdoor_openclose]=Back door
homehub.connectors.homeassistant.names.[sensor.living_room_backdoor_openclose_battery_level]=Back door
homehub.connectors.homeassistant.names.[binary_sensor.kitchen_water_leak_xs_sensor_water_leak_detected]=Kitchen leak sensor
homehub.connectors.homeassistant.names.[sensor.kitchen_water_leak_xs_sensor_battery_level]=Kitchen leak sensor
homehub.connectors.homeassistant.names.[switch.indoor_smart_plug]=Indoor Smart Plug
homehub.connectors.homeassistant.names.[sensor.indoor_smart_plug_electric_consumption_w]=Indoor Smart Plug

# Device controls through Home Assistant. They only work once a PIN is set: homehub.control.pin is a secret
# (see README.md). Only these entities can be changed (comma-separated, * matches anything; number, switch,
# select and button entities only).
homehub.controls.enabled=true
homehub.controls.entities=number.kitchen_refrigerator_*,switch.kitchen_refrigerator_*,button.kitchen_refrigerator_*,select.laundry_room_*,switch.laundry_room_*,switch.indoor_smart_plug

# Alerts: shown on the dashboard and, when homehub.alerts.send-to is set, sent to phones through Home Assistant
# (Companion app). Device names are the dashboard names; keep the [brackets] so the slash survives.
homehub.alerts.enabled=true
# Comma-separated Home Assistant notify actions, e.g. notify.mobile_app_phone. Empty: dashboard only.
homehub.alerts.send-to=
# Page opened when a notification is tapped.
homehub.alerts.link=http://localhost:8080
# A door open longer than this
homehub.alerts.door-open.[Refrigerator/Fridge]=1m
homehub.alerts.door-open.[Refrigerator/Freezer]=2m
# A temperature above this (in the reading's unit) for longer than too-warm-for
homehub.alerts.too-warm.[Refrigerator/Fridge]=45
homehub.alerts.too-warm.[Refrigerator/Freezer]=10
homehub.alerts.too-warm-for=15m
# Report when the cycle ends
homehub.alerts.finished=Washer,Dryer
# A device is offline when ALL its readings are "unavailable" in Home Assistant for this long (device = the part
# before "/"). A quiet device is not offline. Washer and Dryer can be added, but some go offline when switched off.
homehub.alerts.offline.[Refrigerator]=30m
# Home Assistant unreachable this long: dashboard banner (phones only hear "back now", since they're reached through it)
homehub.alerts.connection-lost-after=10m
# Weather notices from the forecast (Home Assistant's units: °F, in), at the hub's local time, once a day.
# Freeze warning when tomorrow's low is at or below freeze-below; rain notice when today has at least rain-from.
# Leave a limit empty to switch that notice off.
homehub.alerts.freeze-below=32
homehub.alerts.freeze-check=19:00
homehub.alerts.rain-from=0.1
homehub.alerts.rain-check=07:00
# Official weather warnings for the house (#106): the home's location and country come from Home Assistant
# (Settings > System > General); the country picks the source (US: National Weather Service, free, no key). Only the
# location rounded to about 1 km is sent. Tornado, severe thunderstorm, flash flood, extreme wind, hurricane and storm
# surge warnings are critical; other warnings are warnings; watches, advisories and statements are notices.
# Daily Home Brief (#21): every evening at this hub time, a short summary of the day (doors, appliances, plugs,
# leaks, alerts, tomorrow's weather) goes to the phones as a quiet notice and into the activity list.
homehub.brief.enabled=true
homehub.brief.at=20:00
homehub.warnings.enabled=true
homehub.warnings.check-every=3m
# Optional: a contact (an email address or website) for the weather service's User-Agent, which the NWS asks for.
homehub.warnings.contact=
# Low battery: a warning when any device's battery reading (Home Assistant sensor.*_battery) is at or below this
# percentage, and "fine again" once the battery is replaced. Empty: no battery warnings.
homehub.alerts.low-battery=20
# Water leak: any leak sensor that reads wet is reported at once, and again when it is dry. The message per sensor
# (dashboard name; write each space in it as "\ "); a sensor not listed here is reported as "Water leak: <name>".
homehub.alerts.leak.[Kitchen\ leak\ sensor]=Water leak in the kitchen
# Ready-made alerts (#100) for every door, window or garage door without a limit of its own (the fridge has one):
# open longer than open-for is a notice by day and a warning at night. Each can be changed or switched off on the
# Devices list. Smoke and CO alarms are critical (below), any lock that jams is a warning.
homehub.alerts.defaults.open-for=10m
homehub.alerts.defaults.night-start=22:00
homehub.alerts.defaults.night-end=06:00
# Critical alerts (#101): ring as an alarm on phones, also on silent and in Do Not Disturb, with an "I'm on it" button,
# and repeat until someone taps it or the problem ends. kinds = which alerts, by the start of their key.
homehub.alerts.critical.kinds=leak,smoke,co,severe
homehub.alerts.critical.repeat-every=5m
homehub.alerts.critical.max-repeats=24
# Nobody answered within escalate-after: also send to these notify actions (e.g. a relative's phone). Empty: nobody.
homehub.alerts.critical.escalate-after=10m
homehub.alerts.critical.escalate-to=
# Android phones that also hear each critical alert spoken at full alarm volume ("Kudil alert. Water leak in the
# kitchen"), even on silent: on some phones the notification alone sounds like any other. Not for iPhones.
homehub.alerts.critical.speak-on=
# Nightly backup missing: the backup (deploy/backup.sh) records each success in status-file. On the hub only
# (prod profile); empty = no backup alerts. Alert when the last good backup is older than missing-after.
homehub.alerts.backup.status-file=
homehub.alerts.backup.missing-after=26h

# Android phones get alerts from Kudil through a self-hosted ntfy server (#154, ADR 12); iPhones keep Home Assistant
# (homehub.alerts.send-to). Off while url or topic is empty. fallback-topic: iPhones subscribed in the ntfy app get an
# alert there when Home Assistant couldn't deliver it. A token, if the server needs one, is a secret:
# homehub.ntfy.token in ~/.homehub/secrets.properties or the systemd credential homehub.ntfy.token.
homehub.ntfy.url=
homehub.ntfy.topic=
homehub.ntfy.fallback-topic=

# Kudil's own read-only connection to the Z-Wave JS server (#134, ADR 12), next to Home Assistant's. Shown at
# /api/status. Empty = off (the prod profile sets it for the hub).
homehub.zwave.url=

# Power cuts, internet outages and the hub's own battery (#103). The hub is a laptop: on battery it keeps running and
# says "Power is out". Off unless set (the prod profile sets both for the hub).
# power-supply-dir: where Linux lists chargers and batteries. internet-hosts: host:port to try; up while any answers.
homehub.hub.power-supply-dir=
homehub.hub.internet-hosts=
homehub.hub.check-every=30s
homehub.hub.internet-lost-after=3m
# Hub battery levels (%) that warn during a power cut; a cut longer than freezer-check-after asks to check the freezer.
homehub.hub.battery-warnings=30,10
homehub.hub.freezer-check-after=2h
homehub.hub.freezer=Refrigerator/Freezer
# Weekly battery health: a notice when it holds less than this % of its design capacity, or runs at 50 °C or more.
homehub.hub.health-below=60

# Watchdog: Home Assistant's SmartThings integration can stop receiving updates without an error. When this entity
# (one that reports every few minutes, day and night) is silent for stale-after, Kudil reloads its integration;
# after 2 reloads that didn't help, phones are alerted. Empty = off (set for the hub in the prod profile).
homehub.watchdog.entity=
homehub.watchdog.stale-after=45m
homehub.watchdog.check-every=5m

# Old events are deleted once a day at cleanup-at (the hub's local time) and once a few minutes after startup.
# The newest event of every device reading is always kept, however old: it is the device's current state.
# 0 or empty = keep that group forever.
# Readings and commands
homehub.events.keep-days=90
# Alerts, all-clears and notices
homehub.events.keep-alert-days=365
homehub.events.cleanup-at=03:30

# Weather card on the dashboard: Home Assistant's weather entity (met.no, set up by Home Assistant itself; no API
# key). Read on demand, kept for the refresh time, never stored as events. Empty entity = no weather card.
homehub.weather.entity=weather.home
homehub.weather.refresh=10m

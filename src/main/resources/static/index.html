<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kudil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234f46e5' d='M12 3 2 11h3v9h5v-6h4v6h5v-9h3z'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #f8f9fc;
    --border: #e4e7ef;
    --text: #1d2330;
    --muted: #6b7385;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --ok: #12805c;      --ok-soft: #e3f6ee;
    --warn: #a15c00;    --warn-soft: #fff1dc;
    --active: #1d5fd1;  --active-soft: #e4eeff;
    --idle: #59627a;    --idle-soft: #eef0f5;
    --bad: #c0362c;     --bad-soft: #fde8e6;
    --new: #fff9db;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 16px rgba(16, 24, 40, .06);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f131a;
      --surface: #171c25;
      --surface-2: #1c222d;
      --border: #2a3140;
      --text: #e8ebf2;
      --muted: #9aa3b5;
      --accent: #8b85ff;
      --accent-soft: #24234a;
      --ok: #4cd6a0;      --ok-soft: #133528;
      --warn: #ffb44d;    --warn-soft: #3b2a10;
      --active: #74a7ff;  --active-soft: #172a4a;
      --idle: #aab2c5;    --idle-soft: #252c39;
      --bad: #ff8a80;     --bad-soft: #3d1a17;
      --new: #2f2a12;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px 48px; }
  svg.icon { width: 20px; height: 20px; flex: none; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  header .wrap { display: flex; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
  .logo {
    display: grid; place-items: center;
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--accent); color: #fff;
  }
  .brand h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .brand p { margin: 0; color: var(--muted); font-size: 13px; }
  /* The running release, on every screen size (phones hide the header subtitle). */
  .app-version { margin: 24px 0 8px; text-align: center; color: var(--muted); font-size: 12px; }
  .live {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); position: relative; }
  .dot::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 2px solid var(--ok); opacity: 0; animation: pulse 2s infinite;
  }
  .live.error .dot { background: var(--bad); }
  .live.error .dot::after { display: none; }
  .live.paused .dot { background: var(--idle); }
  .live.paused .dot::after { display: none; }
  @keyframes pulse { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  /* °F / °C switch */
  .unit-switch {
    display: inline-flex; flex: none; padding: 2px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .unit-switch button {
    border: 0; border-radius: 999px; padding: 4px 9px; background: transparent; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .unit-switch button:hover { color: var(--accent); }
  .unit-switch button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  /* Alerts banner: problems going on right now */
  .alerts { display: grid; gap: 8px; margin: 0 0 20px; }
  .alerts[hidden] { display: none; }
  .alert-item {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--radius);
    background: var(--bad-soft); color: var(--bad); font-weight: 600;
    border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
  }
  .alert-item .since { margin-left: auto; font-size: 12px; font-weight: 400; opacity: .85; white-space: nowrap; }

  /* Weather card */
  .weather {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; margin-bottom: 24px; padding: 16px 18px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .weather[hidden] { display: none; }
  .weather-now { display: flex; align-items: center; gap: 12px; }
  .weather-now svg.icon { width: 42px; height: 42px; color: var(--accent); }
  .weather-temp { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .weather-cond { font-weight: 600; }
  .weather-meta { color: var(--muted); font-size: 13px; }
  .weather-meta.stale { color: var(--warn); }
  .weather-days { display: flex; gap: 8px; margin-left: auto; }
  .weather-day {
    display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 84px; padding: 8px 10px;
    border-radius: 10px; background: var(--surface-2); font-size: 13px;
  }
  .weather-day .name { color: var(--muted); font-weight: 600; }
  .weather-day svg.icon { color: var(--accent); }
  .weather-day .hilo { font-weight: 600; white-space: nowrap; }
  .weather-day .rain { color: var(--active); font-size: 12px; white-space: nowrap; }
  .weather-credit { flex-basis: 100%; margin-top: -6px; color: var(--muted); font-size: 11px; }

  /* Section titles */
  h2 {
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 12px;
  }

  /* Device cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 32px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px;
  }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card-icon {
    display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent-soft); color: var(--accent);
  }
  .card-title { font-weight: 600; }
  .card-sub { font-size: 12px; color: var(--muted); }
  .card-sub.offline { color: var(--bad); font-weight: 600; }
  .reading { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-top: 1px dashed var(--border); }
  .reading:first-of-type { border-top: 0; }
  .reading .label { color: var(--muted); font-size: 13px; }
  .reading-text { display: flex; flex-direction: column; line-height: 1.3; }
  .reading .since { font-size: 11px; color: var(--muted); opacity: .8; }
  .empty-card { color: var(--muted); padding: 24px; text-align: center; grid-column: 1 / -1; }

  /* Controls */
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
  .section-head h2 { margin: 0; }
  .controls-note { color: var(--muted); font-size: 13px; margin: -4px 0 14px; }
  .control { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 10px; padding: 9px 0; border-top: 1px dashed var(--border); }
  .card-head + .control { border-top: 0; }
  .control .label { color: var(--muted); font-size: 13px; }
  .control .note { flex-basis: 100%; font-size: 11px; color: var(--warn); line-height: 1.35; }
  .control-actions { display: flex; align-items: center; gap: 6px; }
  .control select {
    font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  .btn.small { padding: 5px 11px; }
  .btn.primary, .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover, .btn.on:hover { color: #fff; opacity: .9; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .seg { display: inline-flex; gap: 4px; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20;
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px; font-size: 14px;
    background: var(--text); color: var(--bg); box-shadow: var(--shadow);
  }
  .toast.error { background: var(--bad); color: #fff; }
  dialog {
    width: min(340px, calc(100% - 32px)); padding: 20px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  }
  dialog::backdrop { background: rgba(10, 14, 22, .45); }
  dialog h3 { margin: 0 0 4px; font-size: 17px; }
  .dialog-sub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  dialog input {
    width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font: inherit; font-size: 22px; letter-spacing: .35em; text-align: center;
  }
  dialog input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pin-error { min-height: 1.3em; margin: 8px 0 0; color: var(--bad); font-size: 13px; }
  dialog menu { display: flex; justify-content: flex-end; gap: 8px; margin: 12px 0 0; padding: 0; }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap;
    background: var(--idle-soft); color: var(--idle);
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.active { background: var(--active-soft); color: var(--active); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.temp { background: var(--accent-soft); color: var(--accent); }
  .badge.temp::before { display: none; }

  /* Activity panel */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .search {
    flex: 1 1 220px; display: flex; align-items: center; gap: 8px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 0 10px;
    color: var(--muted);
  }
  .search input { border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; padding: 8px 0; width: 100%; }
  .search:focus-within { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0;
    background: var(--surface-2); color: var(--muted);
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
    text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr.new { animation: flash 2.5s ease-out; }
  @keyframes flash { from { background: var(--new); } to { background: transparent; } }
  .device { display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .device .mini { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); }
  .device .part { color: var(--muted); font-weight: 400; }
  .type { color: var(--muted); }
  .when { white-space: nowrap; }
  .when .day { font-weight: 600; }
  .when .clock { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .ago { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .id { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .empty-row td { text-align: center; color: var(--muted); padding: 40px 16px; }
  .footer { display: flex; justify-content: space-between; padding: 10px 16px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }

  header .tabs { display: none; }

  @media (max-width: 640px) {
    .wrap { padding-left: 16px; padding-right: 16px; }
    .brand p, .col-id, .col-ago, .col-type, .live .clock-text { display: none; }
    header { margin-bottom: 16px; }
    header .wrap { gap: 10px; padding-top: 10px; padding-bottom: 10px; }

    /* Tabs: one section at a time */
    header .tabs { display: flex; gap: 6px; padding-top: 0; padding-bottom: 10px; }
    .tabs button {
      flex: 1; min-height: 38px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface); color: var(--muted); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .cards { grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
    .weather { margin-bottom: 20px; padding: 14px; }
    .weather-days { margin-left: 0; width: 100%; }
    .weather-day { flex: 1; min-width: 0; padding: 8px 4px; }

    /* Text of at least 16px stops iPhones from zooming in when a field is tapped */
    .control select, .search input, dialog input { font-size: 16px; }
    .control select { padding: 7px 8px; }
    .btn, .btn.small, .chip { min-height: 38px; padding: 8px 14px; font-size: 14px; }
    .unit-switch button { min-height: 32px; padding: 6px 9px; font-size: 14px; }
    .control { padding: 11px 0; }

    /* Activity: compact two-line rows instead of a wide table */
    .table-scroll { overflow: visible; }
    thead { display: none; }
    tbody tr {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "device value" "when when";
      align-items: center; gap: 4px 10px; padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    tbody tr:last-child { border-bottom: 0; }
    tbody td { padding: 0; border-bottom: 0; }
    tbody td.col-device { grid-area: device; min-width: 0; }
    tbody td.col-value { grid-area: value; justify-self: end; max-width: 52vw; }
    tbody td.when { grid-area: when; display: flex; flex-wrap: wrap; gap: 0 6px; padding-left: 40px; }
    .when .day, .when .clock { font-size: 12px; font-weight: 400; color: var(--muted); }
    .when .day::after { content: " ·"; }
    .device { gap: 8px; }
    .device .mini { width: 32px; height: 32px; }
    td.col-value .badge { white-space: normal; text-align: right; line-height: 1.3; border-radius: 12px; }
    tr.empty-row { display: block; }
    tr.empty-row td { display: block; padding: 32px 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg></div>
    <div class="brand">
      <h1>Kudil</h1>
      <p>Home appliance monitor<span id="appVersion"></span></p>
    </div>
    <div class="live" id="live"><span class="dot"></span><span id="status">Connecting…</span></div>
    <div class="unit-switch" id="unitSwitch" role="group" aria-label="Temperature unit" title="Show temperatures in °F or °C">
      <button type="button" data-unit="F" aria-pressed="false">°F</button>
      <button type="button" data-unit="C" aria-pressed="false">°C</button>
    </div>
    <button class="btn" id="pause" type="button">Pause</button>
  </div>
  <!-- Phones only: one section at a time instead of one very long page -->
  <nav class="tabs wrap" id="tabs" aria-label="Sections">
    <button type="button" data-tab="status">Status</button>
    <button type="button" data-tab="controls">Controls</button>
    <button type="button" data-tab="activity">Activity</button>
  </nav>
</header>

<main class="wrap">
  <!-- Shown on every tab while something needs attention (door left open, too warm) -->
  <section class="alerts" id="alerts" aria-live="polite" hidden></section>

  <div class="tab-panel" data-tab="status">
  <section class="weather" id="weather" aria-label="Weather" hidden></section>
  <h2>Current status</h2>
  <section class="cards" id="cards"></section>
  </div>

  <div class="tab-panel" data-tab="controls">
  <div class="section-head">
    <h2>Controls</h2>
    <button class="btn" id="lockBtn" type="button" hidden></button>
  </div>
  <p class="controls-note" id="controlsNote" hidden></p>
  <section class="cards" id="controls"></section>
  </div>

  <div class="tab-panel" data-tab="activity">
  <h2>Recent activity</h2>
  <section class="panel">
    <div class="toolbar">
      <label class="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search device or value…" autocomplete="off">
      </label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>When</th>
            <th>Device</th>
            <th class="col-type">Event</th>
            <th>Value</th>
            <th class="col-ago">Ago</th>
            <th class="col-id">#</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="footer"><span id="count"></span><span>Live updates</span></div>
  </section>
  </div>
  <p class="app-version">Kudil <span id="footerVersion"></span></p>
</main>

<dialog id="pinDialog">
  <form id="pinForm">
    <h3>Enter PIN</h3>
    <p class="dialog-sub">Needed to change devices. Stays unlocked for 10 minutes of activity.</p>
    <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" required minlength="4">
    <p class="pin-error" id="pinError" role="alert"></p>
    <menu>
      <button class="btn" type="button" id="pinCancel">Cancel</button>
      <button class="btn primary" type="submit">Unlock</button>
    </menu>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const SAFETY_RELOAD_MS = 30000;   // live updates arrive instantly; this only catches anything missed
const MAX_EVENTS = 50;

const ICONS = {
  fridge:  '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M6 10h12M9 5v2M9 13v3"/>',
  washer:  '<rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M8 6h.01M11 6h.01"/>',
  dryer:   '<rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M10 12c1-1 3 1 4 0M8 6h.01"/>',
  lock:    '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  thermo:  '<path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/>',
  bell:    '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  // Weather
  sun:     '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:    '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  cloud:   '<path d="M17.5 19H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20 11a4 4 0 0 1-2.5 8z"/>',
  partly:  '<path d="M8 2v1.5M2.5 8H4M4.1 4.1l1 1M11.9 4.1l-1 1"/><path d="M5.2 10.5A3.5 3.5 0 1 1 11.6 7"/><path d="M17.5 21H9a4 4 0 1 1 .9-7.9A5 5 0 0 1 19 15a3 3 0 0 1-1.5 6z"/>',
  rain:    '<path d="M17.5 15H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20 7a4 4 0 0 1-2.5 8z"/><path d="M8 18v3M12 18v3M16 18v3"/>',
  snow:    '<path d="M17.5 15H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20 7a4 4 0 0 1-2.5 8z"/><path d="M8 19h.01M12 21h.01M16 19h.01"/>',
  storm:   '<path d="M17.5 15H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20 7a4 4 0 0 1-2.5 8z"/><path d="m13 14-3 4h4l-3 4"/>',
  fog:     '<path d="M4 9h16M3 13h18M5 17h14M8 5h8"/>',
  wind:    '<path d="M3 8h10a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7"/>',
  device:  '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'
};

const dayFormat = new Intl.DateTimeFormat(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
const clockFormat = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
const relative = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
const shortClock = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
const weekdayClock = new Intl.DateTimeFormat(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' });
const dateClock = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

let events = [];    // latest 50 events, for the activity table
let activeAlerts = [];   // problems going on now (/api/alerts), for the banner and "Offline" cards
let current = [];   // last value of every reading, for the status cards
let lastSeenId = null;
let activeType = 'all';
let paused = false;
let stream = null;

const $ = id => document.getElementById(id);

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function icon(name) {
  const span = el('span');
  span.innerHTML = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
  return span.firstChild;
}

function iconFor(device, type) {
  const d = (device || '').toLowerCase();
  if (/fridge|refrigerator|freezer|cooler/.test(d)) return 'fridge';
  if (/dryer/.test(d)) return 'dryer';
  if (/wash/.test(d)) return 'washer';
  if (/lock|door/.test(d) || type === 'lock') return 'lock';
  if (/thermostat/.test(d) || type === 'temperature') return 'thermo';
  return 'device';
}

/** "machineState" -> "Machine state" */
// Friendlier names for technical reading types. Display only: the database keeps the original type.
const TYPE_LABELS = { contact: 'Door', command: 'Command', alert: 'Alert', alertCleared: 'All clear', notice: 'Notice' };
// Events HomeHub writes itself: shown in the activity list, never as a device reading.
const ALERT_TYPES = ['alert', 'alertCleared', 'notice'];
const NOT_READINGS = new Set(['command', ...ALERT_TYPES]);

function prettyType(type) {
  if (TYPE_LABELS[type]) return TYPE_LABELS[type];
  const words = (type || '').replace(/([a-z])([A-Z])/g, '$1 $2').toLowerCase();
  return words.charAt(0).toUpperCase() + words.slice(1);
}

function badge(type, value) {
  const v = (value ?? '').toString();
  const lower = v.toLowerCase();
  let tone = '';
  if (type === 'alert' || lower === 'unavailable') tone = 'bad';   // also for a temperature that has no value
  else if (type === 'temperature' || type === 'command') tone = 'temp';
  else if (type === 'alertCleared' || type === 'notice') tone = 'ok';
  else if (['closed', 'locked', 'done', 'finished', 'finish'].includes(lower)) tone = 'ok';
  else if (['open', 'unlocked', 'pause', 'paused'].includes(lower)) tone = 'warn';
  else if (['error', 'fault', 'alarm', 'unavailable'].includes(lower)) tone = 'bad';
  else if (['run', 'running', 'wash', 'rinse', 'spin', 'drying', 'cooling'].includes(lower)) tone = 'active';
  // Any other machine/job state that isn't idle means the appliance is busy (e.g. ai_wash, pre_wash, wrinkle_prevent).
  else if (/state$/i.test(type) && !['stop', 'none', 'idle', 'unknown'].includes(lower)) tone = 'active';
  return el('span', 'badge ' + tone, formatValue(type, v));
}

function formatValue(type, value) {
  if (type === 'temperature' && /^-?\d/.test(value)) {
    const m = TEMP_READING.exec(value);   // "37.5 F"; a number without a unit is shown as it is
    return m ? showTemp(m[1], m[2]) : value;
  }
  const text = keepTogether(convertTemps(value.replace(/_/g, ' ')));
  return text ? text.charAt(0).toUpperCase() + text.slice(1) : '—';
}

/** "43 °F" -> "43&nbsp;°F": keeps a temperature together when the text wraps. */
function keepTogether(text) {
  return text.replace(/ (°[FC])/g, String.fromCharCode(160) + '$1');
}

// ---------------------------------------------------------------- temperature unit (°F / °C)
// Display only: readings, the weather and the API keep Home Assistant's unit, and nothing converted is ever sent back.

const UNIT_KEY = 'homehub.tempUnit';
const TEMP_READING = /^(-?\d+(?:\.\d+)?) ?([FC])$/i;            // a temperature event's value: "37.5 F"
const TEMP_IN_TEXT = /(-?\d+(?:\.\d+)?) ?°([FC])\b/g;           // inside a message: "too warm: 47.5 °F (above 45 °F"
let unitChoice = null;   // 'F' or 'C' once chosen; null = show every temperature in the unit it came in

/** Converts a temperature to the chosen unit: { n, unit, converted }. `from` is 'F' or 'C'. */
function toChosenUnit(n, from) {
  from = from.toUpperCase();
  if (!unitChoice || unitChoice === from || !Number.isFinite(n)) return { n, unit: from, converted: false };
  return { n: unitChoice === 'C' ? (n - 32) * 5 / 9 : n * 9 / 5 + 32, unit: unitChoice, converted: true };
}

/** One decimal at most: 2.7777 -> "2.8", 3.0 -> "3", -0.04 -> "0". */
function oneDecimal(n) {
  const r = Math.round(n * 10) / 10;
  return String(r === 0 ? 0 : r);
}

/** "37.5", "F" -> "37.5°F", or "3.1°C" when °C is chosen. An unconverted number keeps its own text. */
function showTemp(numberText, from) {
  const t = toChosenUnit(Number(numberText), from);
  return (t.converted ? oneDecimal(t.n) : numberText) + '°' + t.unit;
}

/** Converts every "47.5 °F" inside a server-written text, e.g. an alert or a command in the activity list. */
function convertTemps(text) {
  if (!unitChoice) return text;
  return text.replace(TEMP_IN_TEXT, (all, n, from) => {
    const t = toChosenUnit(Number(n), from);
    return t.converted ? oneDecimal(t.n) + ' °' + t.unit : all;
  });
}

/** The unit the data comes in, for the switch before anything was chosen: the weather's or a reading's, else °F. */
function dataUnit() {
  const weatherUnit = lastWeather && /^°?\s*([FC])$/i.exec(lastWeather.temperatureUnit || '');
  if (weatherUnit) return weatherUnit[1].toUpperCase();
  const reading = current.map(e => e.type === 'temperature' && TEMP_READING.exec(e.value || '')).find(Boolean);
  return reading ? reading[2].toUpperCase() : 'F';
}

function renderUnitSwitch() {
  const shown = unitChoice || dataUnit();
  document.querySelectorAll('#unitSwitch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.unit === shown)));
}

/** The switch was used: remember the choice and show every temperature again in it. */
function setUnit(unit) {
  unitChoice = unit;
  try { localStorage.setItem(UNIT_KEY, unit); } catch (err) { /* private mode: just don't remember */ }
  renderAll();
  renderAlerts(activeAlerts);
  if (lastWeather) renderWeather(lastWeather);
  renderControls();
}

function timeAgo(date) {
  const secs = Math.round((date - Date.now()) / 1000);
  const abs = Math.abs(secs);
  if (abs < 60) return relative.format(secs, 'second');
  if (abs < 3600) return relative.format(Math.round(secs / 60), 'minute');
  if (abs < 86400) return relative.format(Math.round(secs / 3600), 'hour');
  return relative.format(Math.round(secs / 86400), 'day');
}

/** "Refrigerator/cooler" -> { main: "Refrigerator", part: "cooler" } */
function splitDevice(device) {
  const i = (device || '').indexOf('/');
  return i < 0 ? { main: device, part: '' } : { main: device.slice(0, i), part: device.slice(i + 1) };
}

/** "4:51 PM" today, "Wed 10:48 PM" this week, otherwise "Oct 28, 10:48 PM". */
function sinceText(date) {
  const now = new Date();
  if (date.toDateString() === now.toDateString()) return shortClock.format(date);
  if (now - date < 6 * 86400000) return weekdayClock.format(date);
  return dateClock.format(date);
}

/** Keeps `current` (last value of every reading) up to date with a newly saved event. */
function updateCurrent(e) {
  const key = readingKey(e);
  const i = current.findIndex(x => readingKey(x) === key);
  if (i < 0) current.push(e);
  else if (e.id > current[i].id) current[i] = e;
}

function readingKey(e) {
  return (e.device + '|' + e.type).toLowerCase();   // "freezer" and "Freezer" are the same reading
}

function renderCards() {
  const cards = $('cards');
  // The last value of every reading, however old: from /api/events/latest plus live updates.
  const devices = new Map();
  for (const e of [...current].sort((a, b) => b.id - a.id)) {
    if (NOT_READINGS.has(e.type)) continue;   // commands and alerts are shown in the activity list instead
    const { main, part } = splitDevice(e.device);
    const time = new Date(e.time);
    if (!devices.has(main)) devices.set(main, { name: main, readings: new Map(), updated: time });
    const device = devices.get(main);
    if (time > device.updated) device.updated = time;
    const key = ((part ? part + ' ' : '') + e.type).toLowerCase();
    if (!device.readings.has(key)) {
      device.readings.set(key, {
        label: (part ? prettyType(part) + ' · ' : '') + prettyType(e.type).toLowerCase(),
        type: e.type, value: e.value, time
      });
    }
  }

  cards.replaceChildren();
  if (devices.size === 0) {
    cards.append(el('div', 'card empty-card', 'No devices have reported yet.'));
    return;
  }
  for (const d of [...devices.values()].sort((a, b) => a.name.localeCompare(b.name))) {
    const card = el('article', 'card');
    const head = el('div', 'card-head');
    const ic = el('div', 'card-icon'); ic.append(icon(iconFor(d.name)));
    const titles = el('div');
    const offline = activeAlerts.find(a => a.key.startsWith('offline:') && a.device.toLowerCase() === d.name.toLowerCase());
    titles.append(el('div', 'card-title', d.name), offline
      ? el('div', 'card-sub offline', 'Offline since ' + sinceText(new Date(offline.time)))
      : el('div', 'card-sub', 'Updated ' + timeAgo(d.updated)));
    head.append(ic, titles);
    card.append(head);
    for (const r of [...d.readings.values()].sort((a, b) => a.label.localeCompare(b.label))) {
      const row = el('div', 'reading');
      const text = el('div', 'reading-text');
      const since = el('span', 'since', 'since ' + sinceText(r.time));
      since.title = dayFormat.format(r.time) + ', ' + clockFormat.format(r.time) + ' (' + timeAgo(r.time) + ')';
      text.append(el('span', 'label', r.label.charAt(0).toUpperCase() + r.label.slice(1)), since);
      row.append(text, badge(r.type, r.value));
      card.append(row);
    }
    cards.append(card);
  }
}

function renderChips() {
  const types = ['all', ...new Set(events.map(e => e.type))];
  if (!types.includes(activeType)) activeType = 'all';
  const chips = $('chips');
  chips.replaceChildren(...types.map(t => {
    const b = el('button', 'chip', t === 'all' ? 'All' : prettyType(t));
    b.type = 'button';
    b.setAttribute('aria-pressed', String(t === activeType));
    b.onclick = () => { activeType = t; renderChips(); renderTable(); };
    return b;
  }));
}

function renderTable(newIds = new Set()) {
  const q = $('search').value.trim().toLowerCase();
  const shown = events.filter(e =>
    (activeType === 'all' || e.type === activeType) &&
    (!q || `${e.device} ${e.type} ${prettyType(e.type)} ${e.value} ${formatValue(e.type, e.value ?? '')}`.toLowerCase().includes(q)));

  const rows = $('rows');
  if (shown.length === 0) {
    const tr = el('tr', 'empty-row');
    const td = el('td', '', events.length ? 'No events match your filter.' : 'Waiting for the first event…');
    td.colSpan = 6;
    tr.append(td);
    rows.replaceChildren(tr);
  } else {
    rows.replaceChildren(...shown.map(e => {
      const date = new Date(e.time);
      const tr = el('tr', newIds.has(e.id) ? 'new' : '');

      const when = el('td', 'when');
      when.append(el('div', 'day', dayFormat.format(date)), el('div', 'clock', clockFormat.format(date)));

      const device = el('td', 'col-device');
      const wrap = el('div', 'device');
      const mini = el('span', 'mini'); mini.append(icon(iconFor(e.device, e.type)));
      const { main, part } = splitDevice(e.device);
      const name = el('span', '', main);
      if (part) name.append(' ', el('span', 'part', '· ' + part));
      wrap.append(mini, name);
      device.append(wrap);

      const value = el('td', 'col-value'); value.append(badge(e.type, e.value));

      tr.append(when, device, el('td', 'type col-type', prettyType(e.type)), value,
                el('td', 'ago col-ago', timeAgo(date)), el('td', 'id col-id', e.id));
      return tr;
    }));
  }
  $('count').textContent = `Showing ${shown.length} of ${events.length} latest events`;
}

function setStatus(text, state, clock) {
  const status = $('status');
  status.textContent = text;
  if (clock) status.append(el('span', 'clock-text', ' · ' + clock));
  $('live').className = 'live' + (state ? ' ' + state : '');
}

function renderAll(newIds) {
  renderCards();
  renderChips();
  renderTable(newIds);
  renderUnitSwitch();
}

/** Full reload of the latest 50 events. Used at start, after every reconnect and as a slow safety net. */
// ---------------------------------------------------------------- weather

// Home Assistant weather conditions -> icon and label.
const WEATHER = {
  'clear-night': ['moon', 'Clear'], sunny: ['sun', 'Sunny'], partlycloudy: ['partly', 'Partly cloudy'],
  cloudy: ['cloud', 'Cloudy'], fog: ['fog', 'Fog'], rainy: ['rain', 'Rain'], pouring: ['rain', 'Heavy rain'],
  snowy: ['snow', 'Snow'], 'snowy-rainy': ['snow', 'Sleet'], hail: ['snow', 'Hail'],
  lightning: ['storm', 'Thunderstorms'], 'lightning-rainy': ['storm', 'Thunderstorms'],
  windy: ['wind', 'Windy'], 'windy-variant': ['wind', 'Windy'], exceptional: ['storm', 'Severe weather']
};
const weekdayShort = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
let lastWeather = null;   // kept to show it again when the temperature unit changes

async function loadWeather() {
  try {
    const res = await fetch('/api/weather', { cache: 'no-store' });
    if (res.status === 204) { $('weather').hidden = true; return; }
    if (res.ok) renderWeather(await res.json());
  } catch (err) { /* offline: keep what is shown */ }
}

function renderWeather(w) {
  lastWeather = w;
  const box = $('weather');
  const [iconName, label] = WEATHER[w.condition] || ['cloud', w.condition ? w.condition.replace(/[-_]/g, ' ') : ''];
  const known = /^°?\s*([FC])$/i.exec(w.temperatureUnit || '');   // only °F and °C can be converted
  const from = known ? known[1].toUpperCase() : null;
  const unit = from ? (unitChoice || from) : (w.temperatureUnit || '').replace('°', '');
  // Whole degrees; "|| 0" turns -0 into 0.
  const deg = t => t == null ? '–' : (Math.round(from ? toChosenUnit(t, from).n : t) || 0) + '°';

  const now = el('div', 'weather-now');
  if (w.temperature == null || !WEATHER[w.condition]) {
    now.append(icon('cloud'), el('div', 'weather-cond', 'Weather unavailable right now'));
  } else {
    const text = el('div');
    const parts = [];
    if (w.humidity != null) parts.push('Humidity ' + Math.round(w.humidity) + '%');
    if (w.windSpeed != null) parts.push('Wind ' + Math.round(w.windSpeed) + ' ' + (w.windSpeedUnit || ''));
    text.append(el('div', 'weather-cond', label), el('div', 'weather-meta', parts.join(' · ')));
    now.append(icon(iconName), el('div', 'weather-temp', deg(w.temperature) + unit), text);
  }

  const days = el('div', 'weather-days');
  (w.days || []).forEach((d, i) => {
    const [dayIcon, dayLabel] = WEATHER[d.condition] || ['cloud', d.condition || ''];
    const card = el('div', 'weather-day');
    card.title = dayLabel;
    card.append(el('span', 'name', i === 0 ? 'Today' : weekdayShort.format(new Date(d.time))), icon(dayIcon),
                el('span', 'hilo', deg(d.high) + ' / ' + deg(d.low)));
    if (d.precipitation > 0) card.append(el('span', 'rain', Number(d.precipitation.toFixed(2)) + ' ' + (w.precipitationUnit || '')));
    days.append(card);
  });

  const children = [now, days];
  if (w.stale) {
    children.push(el('div', 'weather-meta stale', 'Last updated ' + sinceText(new Date(w.fetchedAt))
      + ': Home Assistant is not reachable'));
  }
  if (w.attribution) children.push(el('div', 'weather-credit', w.attribution));
  box.replaceChildren(...children);
  box.hidden = false;
  renderUnitSwitch();
}

let everLoaded = false;
async function load() {
  everLoaded = true;
  loadAlerts();   // in parallel: the banner shouldn't wait for the activity list
  loadWeather();  // the server keeps it for 10 minutes, so asking often is cheap
  try {
    const [res, latestRes] = await Promise.all([
      fetch('/api/events', { cache: 'no-store' }),
      fetch('/api/events/latest', { cache: 'no-store' })
    ]);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    if (!latestRes.ok) throw new Error('HTTP ' + latestRes.status);
    events = await res.json();
    current = await latestRes.json();

    const newIds = new Set(lastSeenId === null ? [] : events.filter(e => e.id > lastSeenId).map(e => e.id));
    if (events.length) lastSeenId = Math.max(lastSeenId ?? 0, ...events.map(e => e.id));

    renderAll(newIds);
    loadControls();
    if (!paused && stream && stream.readyState === EventSource.OPEN) setStatus('Live', '', clockFormat.format(new Date()));
  } catch (err) {
    setStatus('Offline · retrying', 'error');
  }
}

/**
 * Reloads the page when the server restarted (a deploy), so every open dashboard picks up the new version.
 * Skipped while the PIN dialog is open, so a reload never interrupts someone typing.
 */
let serverStarted = null;
async function checkVersion() {
  try {
    const res = await fetch('/api/version', { cache: 'no-store' });
    if (!res.ok) return;
    const { started, version } = await res.json();
    if (serverStarted && started !== serverStarted) {
      if (!$('pinDialog').open) location.reload();   // otherwise: reload on the next check
      return;
    }
    serverStarted = started;
    showVersion(version);
  } catch (err) { /* offline: try again on the next reconnect */ }
}

/** "0.5.0" -> "v0.5.0"; a build from source ("0.0.1-SNAPSHOT", "dev") -> "dev". */
function showVersion(version) {
  const label = /^\d+\.\d+\.\d+$/.test(version || '') ? 'v' + version : 'dev';
  $('appVersion').textContent = ' · ' + label;
  $('footerVersion').textContent = label;
}

/** One event pushed by the server the moment it was saved. */
function addLiveEvent(e) {
  if (events.some(x => x.id === e.id)) return;
  events = [e, ...events].sort((a, b) => b.id - a.id).slice(0, MAX_EVENTS);
  updateCurrent(e);
  lastSeenId = Math.max(lastSeenId ?? 0, e.id);
  renderAll(new Set([e.id]));
  setStatus('Live', '', clockFormat.format(new Date()));
  if (e.type === 'command') setTimeout(loadControls, 1500);   // someone changed a device: show its new setting
  if (ALERT_TYPES.includes(e.type)) loadAlerts();               // a problem started or ended
}

// ---------------------------------------------------------------- alerts

async function loadAlerts() {
  try {
    const res = await fetch('/api/alerts', { cache: 'no-store' });
    if (res.ok) renderAlerts(await res.json());
  } catch (err) { /* offline: keep what is shown */ }
}

function renderAlerts(list) {
  const offlineChanged = JSON.stringify(list.filter(a => a.key.startsWith('offline:')))
                      !== JSON.stringify(activeAlerts.filter(a => a.key.startsWith('offline:')));
  activeAlerts = list;
  if (offlineChanged) renderCards();
  const box = $('alerts');
  box.hidden = list.length === 0;
  box.replaceChildren(...list.map(a => {
    const since = new Date(a.time);
    const item = el('div', 'alert-item');
    const when = el('span', 'since', 'since ' + sinceText(since));
    when.title = dayFormat.format(since) + ', ' + clockFormat.format(since);
    item.append(icon('bell'), el('span', '', keepTogether(convertTemps(a.message || ''))), when);
    return item;
  }));
}

// ---------------------------------------------------------------- device controls

const PIN_HEADER = 'X-HomeHub-Pin';
const AUTO_LOCK_MS = 10 * 60 * 1000;
const CYCLE_VERBS = { run: 'Start', pause: 'Pause', stop: 'Stop' };

let controlsView = { enabled: false, controls: [] };
let controlPin = null;   // kept only in memory: never stored, gone when the tab closes
let lockTimer = null;
let pinResolve = null;

async function loadControls() {
  try {
    const res = await fetch('/api/controls', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    controlsView = await res.json();
  } catch (err) {
    controlsView = { enabled: false, reason: 'Controls are not available right now.', controls: [] };
  }
  renderControls();
}

function optionLabel(option) {
  const text = String(option).replace(/_/g, ' ');
  return text.charAt(0).toUpperCase() + text.slice(1);
}

function numberValues(c) {
  const step = c.step > 0 ? c.step : 1;
  const decimals = (String(step).split('.')[1] || '').length;
  const values = [];
  for (let v = c.min; v <= c.max + step / 1000 && values.length < 300; v += step) values.push(Number(v.toFixed(decimals)));
  return values;
}

function renderControls() {
  const note = $('controlsNote');
  note.textContent = controlsView.reason || '';
  note.hidden = !controlsView.reason;
  const lockBtn = $('lockBtn');
  lockBtn.hidden = !controlsView.enabled;
  lockBtn.textContent = controlPin ? 'Lock' : 'Unlock';

  const groups = new Map();
  for (const c of controlsView.controls || []) {
    if (!groups.has(c.device)) groups.set(c.device, []);
    groups.get(c.device).push(c);
  }
  const box = $('controls');
  box.replaceChildren();
  for (const [device, controls] of groups) {
    const card = el('article', 'card');
    const head = el('div', 'card-head');
    const ic = el('div', 'card-icon'); ic.append(icon(iconFor(device)));
    const titles = el('div');
    titles.append(el('div', 'card-title', device),
        el('div', 'card-sub', !controlsView.enabled ? 'View only' : controlPin ? 'Unlocked' : 'Locked · PIN needed to change'));
    head.append(ic, titles);
    card.append(head);
    for (const c of controls) card.append(controlRow(c));
    box.append(card);
  }
}

function controlRow(c) {
  const row = el('div', 'control');
  const actions = el('div', 'control-actions');
  const disabled = !controlsView.enabled;
  const button = (text, onClick, extra = '') => {
    const b = el('button', 'btn small ' + extra, text);
    b.type = 'button';
    b.disabled = disabled;
    b.onclick = onClick;
    return b;
  };

  if (c.kind === 'number') {
    // The options keep the device's own numbers as their values, so what is sent to Home Assistant is never a
    // converted number; only the text shows the chosen unit.
    const unit = c.unit ? ' ' + c.unit : '';
    const tempUnit = /^°?\s*([FC])$/i.exec(c.unit || '');
    const shown = v => {
      const t = tempUnit ? toChosenUnit(Number(v), tempUnit[1]) : null;
      return t && t.converted ? oneDecimal(t.n) + ' °' + t.unit : v + unit;
    };
    // In the confirmation, a converted value also names the device's own setting: "3.3 °C (38 °F)".
    const both = v => shown(v) === v + unit ? v + unit : shown(v) + ' (' + v + unit + ')';
    const select = el('select');
    select.disabled = disabled;
    select.setAttribute('aria-label', c.label);
    for (const v of numberValues(c)) {
      const o = el('option', '', shown(v));
      o.value = v;
      if (Number(c.value) === v) o.selected = true;
      select.append(o);
    }
    actions.append(select, button('Set', () => {
      if (Number(select.value) === Number(c.value)) return toast(c.label + ' is already ' + shown(c.value) + '.');
      if (confirm('Set ' + c.label.toLowerCase() + ' to ' + both(select.value) + '?')) sendCommand(c, select.value);
    }));
  } else if (c.kind === 'switch') {
    const on = c.value === 'on';
    actions.append(button(on ? 'On' : 'Off', () => {
      const next = on ? 'off' : 'on';
      if (confirm('Turn ' + c.label.toLowerCase() + ' ' + next + '?')) sendCommand(c, next);
    }, on ? 'on' : ''));
  } else if (c.kind === 'cycle') {
    const seg = el('div', 'seg');
    for (const option of ['run', 'pause', 'stop'].filter(o => c.options.includes(o))) {
      seg.append(button(CYCLE_VERBS[option], () => {
        if (confirm(CYCLE_VERBS[option] + ' the ' + c.device.toLowerCase() + '?')) sendCommand(c, option);
      }, c.value === option ? 'on' : ''));
    }
    actions.append(seg);
  } else if (c.kind === 'select') {
    const select = el('select');
    select.disabled = disabled;
    select.setAttribute('aria-label', c.label);
    for (const option of c.options) {
      const o = el('option', '', optionLabel(option));
      o.value = option;
      if (c.value === option) o.selected = true;
      select.append(o);
    }
    actions.append(select, button('Set', () => {
      if (select.value === c.value) return toast(c.label + ' is already ' + optionLabel(c.value).toLowerCase() + '.');
      if (confirm('Set ' + c.label.toLowerCase() + ' to ' + optionLabel(select.value).toLowerCase() + '?')) sendCommand(c, select.value);
    }));
  } else if (c.kind === 'button') {
    actions.append(button('Press', () => {
      if (confirm(c.label + '?')) sendCommand(c, '');
    }));
  }

  row.append(el('span', 'label', c.label), actions);
  if (c.note) row.append(el('span', 'note', c.note));
  return row;
}

async function sendCommand(c, value) {
  if (!await ensureUnlocked()) return;
  try {
    const res = await fetch('/api/controls/' + encodeURIComponent(c.id), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', [PIN_HEADER]: controlPin },
      body: JSON.stringify({ value })
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401 || res.status === 429 || res.status === 403) lockControls();
    if (!res.ok) return toast(body.message || 'That didn\'t work (HTTP ' + res.status + ').', true);
    toast(body.message ? convertTemps(body.message) : 'Done.');
    keepUnlocked();
    setTimeout(loadControls, 1500);   // give the device a moment, then show its new state
  } catch (err) {
    toast('Kudil is not reachable.', true);
  }
}

/** Resolves true once the PIN has been accepted (asking for it if needed), false if the user cancels. */
function ensureUnlocked() {
  if (controlPin) return Promise.resolve(true);
  $('pinError').textContent = '';
  $('pinInput').value = '';
  $('pinDialog').showModal();
  $('pinInput').focus();
  return new Promise(resolve => { pinResolve = resolve; });
}

function closePinDialog(result) {
  $('pinDialog').close();
  if (pinResolve) pinResolve(result);
  pinResolve = null;
}

$('pinForm').addEventListener('submit', async event => {
  event.preventDefault();
  const attempt = $('pinInput').value;
  try {
    const res = await fetch('/api/controls/unlock', { method: 'POST', headers: { [PIN_HEADER]: attempt } });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      $('pinError').textContent = body.message || 'Could not check the PIN.';
      $('pinInput').select();
      return;
    }
    controlPin = attempt;
    keepUnlocked();
    renderControls();
    closePinDialog(true);
  } catch (err) {
    $('pinError').textContent = 'Kudil is not reachable.';
  }
});
$('pinCancel').addEventListener('click', () => closePinDialog(false));
$('pinDialog').addEventListener('cancel', () => { if (pinResolve) pinResolve(false); pinResolve = null; });

$('lockBtn').addEventListener('click', () => {
  if (controlPin) lockControls();
  else ensureUnlocked();
});

function keepUnlocked() {
  clearTimeout(lockTimer);
  lockTimer = setTimeout(lockControls, AUTO_LOCK_MS);
}

function lockControls() {
  controlPin = null;
  clearTimeout(lockTimer);
  renderControls();
}

let toastTimer = null;
function toast(message, isError = false) {
  const t = $('toast');
  t.textContent = message;
  t.className = 'toast' + (isError ? ' error' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, isError ? 6000 : 3500);
}

function connect() {
  stream = new EventSource('/api/events/stream');
  stream.onopen = () => { checkVersion(); load(); };   // (re)connected: catch up on anything missed while disconnected
  stream.addEventListener('event', msg => {
    try { addLiveEvent(JSON.parse(msg.data)); } catch (err) { /* ignore a malformed message */ }
  });
  stream.onerror = () => {
    // The browser reconnects by itself; just show it.
    if (!paused) setStatus(stream.readyState === EventSource.CLOSED ? 'Offline · retrying' : 'Reconnecting…', 'error');
    if (stream.readyState === EventSource.CLOSED) setTimeout(() => { if (!paused) connect(); }, 5000);
  };
}

function disconnect() {
  if (stream) stream.close();
  stream = null;
}

$('search').addEventListener('input', () => renderTable());

// Phone tabs (desktop shows every section, so this only matters on small screens).
const TAB_KEY = 'homehub.tab';
function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.tab === name));
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === name)));
  try { localStorage.setItem(TAB_KEY, name); } catch (err) { /* private mode: just don't remember */ }
}
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { showTab(b.dataset.tab); window.scrollTo(0, 0); }));
let savedTab = null;
try { savedTab = localStorage.getItem(TAB_KEY); } catch (err) { /* ignore */ }
showTab(['status', 'controls', 'activity'].includes(savedTab) ? savedTab : 'status');

// Temperature unit: remembered per browser. "?unit=c" or "?unit=f" in the address chooses it too (e.g. a bookmark).
document.querySelectorAll('#unitSwitch button').forEach(b => b.addEventListener('click', () => setUnit(b.dataset.unit)));
{
  const params = new URLSearchParams(location.search);
  const fromUrl = (params.get('unit') || '').toUpperCase();
  let saved = null;
  try { saved = localStorage.getItem(UNIT_KEY); } catch (err) { /* ignore */ }
  if (fromUrl === 'F' || fromUrl === 'C') {
    unitChoice = fromUrl;
    try { localStorage.setItem(UNIT_KEY, fromUrl); } catch (err) { /* ignore */ }
    params.delete('unit');   // keep the address clean, so a later choice on the switch isn't undone by a reload
    const rest = params.toString();
    try { history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash); } catch (err) { /* ignore */ }
  } else if (saved === 'F' || saved === 'C') {
    unitChoice = saved;
  }
  renderUnitSwitch();   // nothing else is shown yet: load() below draws everything in this unit
}

$('pause').addEventListener('click', () => {
  paused = !paused;
  $('pause').textContent = paused ? 'Resume' : 'Pause';
  if (paused) {
    disconnect();
    setStatus('Paused', 'paused');
  } else {
    connect();
  }
});

// The live stream loads everything when it opens (see connect), so the page doesn't load twice on start.
// If the stream is slow to open, don't keep the page empty waiting for it.
connect();
setTimeout(() => { if (!everLoaded) load(); }, 3000);

// Periodic work only while someone can see the page: a phone in a pocket or a tab in the background makes no
// requests. Live events still arrive, and showing the page again catches up at once.
const watched = () => !paused && !document.hidden;
setInterval(() => { if (watched()) { checkVersion(); load(); } }, SAFETY_RELOAD_MS);
// Keep "x seconds ago" and "Updated ..." current between events.
setInterval(() => { if (watched() && events.length) { renderCards(); renderTable(); } }, 10000);
document.addEventListener('visibilitychange', () => { if (watched()) { checkVersion(); load(); } });
</script>
</body>

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: bash ./mvnw -B -ntp verify
      - name: Keep the jar for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: homehub-jar
          path: target/homehub-*.jar
          retention-days: 7

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check the hub scripts
        # They run as root on the live hub, so a typo must fail the PR, not the deploy.
        # ShellCheck (GPL-3.0) is preinstalled on the GitHub runner; it is a CI tool, not part of the app.
        run: shellcheck deploy/*.sh
      - name: Build and test
        run: bash ./mvnw -B -ntp verify
      - name: List dependency licenses
        # Written by the license check in the build (ADR 8); a GPL/AGPL dependency fails the step above.
        run: cat target/generated-sources/license/THIRD-PARTY.txt
      - name: Keep the license list
        uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: target/generated-sources/license/THIRD-PARTY.txt
          retention-days: 30
      - name: Keep the jar for 7 days
        uses: actions/upload-artifact@v7
        with:
          name: homehub-jar
          path: target/homehub-*.jar
          retention-days: 7

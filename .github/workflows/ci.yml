name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check the hub scripts
        # They run as root on the live hub, so a typo must fail the PR, not the deploy.
        # ShellCheck (GPL-3.0) is preinstalled on the GitHub runner; it is a CI tool, not part of the app.
        run: shellcheck deploy/*.sh deploy/test/*.sh
      - name: Test the Home Assistant update script
        # With stand-in docker, systemctl and curl that only record what they are asked to do.
        run: bash deploy/test/ha-update-test.sh
      - name: Test the Z-Wave setup script
        # With stand-in docker and curl that only record what they are asked to do.
        run: bash deploy/test/zwave-setup-test.sh
      - name: Test the backup script
        # sqlite3 is preinstalled on GitHub's Ubuntu runners; installed here only if an image ever drops it.
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q sqlite3; }
          bash deploy/test/backup-test.sh
      - name: Test the restore check
        # Builds small backup archives with sqlite3 and checks restore-check.sh's report on good and damaged ones.
        run: |
          command -v sqlite3 >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q sqlite3; }
          bash deploy/test/restore-check-test.sh
      - name: Test the firewall script
        # With a stand-in ufw that only records the rules it is asked to add or remove.
        run: bash deploy/test/firewall-test.sh
      - name: Test the ntfy setup script
        # With stand-in curl, dpkg, systemctl, ufw and ntfy, and temporary folders for /etc and /var.
        run: bash deploy/test/ntfy-setup-test.sh
      - name: Build and test
        run: bash ./mvnw -B -ntp verify
      - name: List dependency licenses
        # Written by the license check in the build (ADR 8); a GPL/AGPL dependency fails the step above.
        run: cat target/generated-sources/license/THIRD-PARTY.txt
      - name: Keep the license list
        uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: target/generated-sources/license/THIRD-PARTY.txt
          retention-days: 30
      - name: Keep the jar for 7 days
        uses: actions/upload-artifact@v7
        with:
          name: homehub-jar
          path: target/homehub-*.jar
          retention-days: 7

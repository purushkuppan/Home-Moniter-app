name: Release and deploy

# Push a version tag (for example: git tag v0.3.2 && git push origin v0.3.2) to build,
# publish a GitHub Release, and deploy to the home hub through its self-hosted runner.
# Only tags trigger this workflow, never pull requests: the hub's runner must not run code from PRs.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: deploy-home-hub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub Release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: bash ./mvnw -B -ntp verify
      - name: Prepare the jar
        run: |
          mkdir -p dist
          cp target/homehub-*.jar dist/homehub.jar
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/homehub.jar --generate-notes --title "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: homehub-release
          path: dist/homehub.jar
          retention-days: 30

  deploy:
    needs: build
    # Only in the owner's repository (never in a fork), on the hub's own runner.
    if: github.repository == 'purushkuppan/Home-Moniter-app'
    runs-on: [self-hosted, linux, home-hub]
    timeout-minutes: 15
    steps:
      - name: Deploy only versions newer than the one running
        id: check
        run: |
          current="$(basename "$(readlink -f /opt/homehub/current 2>/dev/null)" 2>/dev/null || true)"
          newest="$(printf '%s\n%s\n' "$current" "$GITHUB_REF_NAME" | sort -V | tail -n 1)"
          if [[ "$current" =~ ^v[0-9] && ( "$GITHUB_REF_NAME" == "$current" || "$newest" != "$GITHUB_REF_NAME" ) ]]; then
            echo "::notice::Not deploying $GITHUB_REF_NAME: the hub already runs $current."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Deploying $GITHUB_REF_NAME (running: ${current:-none})."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: homehub-release
      - name: Install, restart and health-check (rolls back on failure)
        if: steps.check.outputs.deploy == 'true'
        run: sudo /opt/homehub/bin/install-release.sh "$PWD/homehub.jar" "$GITHUB_REF_NAME"
